[workspace]
resolver = "2"
members = [
    "crates/phase1-axum-baseline",
    "crates/phase2-iouring-max",
    "crates/phase3-kernel-unleashed",
    "crates/phase4-kernel-bypass",
    "crates/load-tester",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
