[package]
name = "load-tester"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
hdrhistogram = "7.5"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
