services:
  # ============================================================================
  # PHASE 1: Baseline (Nginx Reverse Proxy + Axum Multi-threaded Server)
  # ============================================================================
  phase1-axum:
    build:
      context: .
      dockerfile: docker/phase1/Dockerfile
    container_name: hyperion-phase1-axum
    profiles: [phase1]
    env_file: [docker/phase1/.env.phase1]
    cpus: "1.5"
    mem_limit: "3g"
    volumes:
      - phase1-db-data:/data
    networks:
      hyperion-net:
        ipv4_address: 172.28.0.3

  phase1-nginx:
    image: nginx:alpine
    container_name: hyperion-phase1-nginx
    profiles: [phase1]
    cpus: "0.5"
    mem_limit: "1g"
    volumes:
      - ./docker/phase1/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - phase1-axum
    networks:
      hyperion-net:
        ipv4_address: 172.28.0.2

  load-tester-phase1:
    build:
      context: .
      dockerfile: docker/load-tester/Dockerfile
    container_name: hyperion-load-tester-phase1
    profiles: [phase1]
    cap_add:
      - NET_ADMIN
    depends_on:
      - phase1-nginx
    command: >
      /app/load-tester
      --target http://172.28.0.2:80
      --concurrency 15000
      --duration 30
      --ramp-up 10
      --ips 172.28.0.10,172.28.0.11,172.28.0.12,172.28.0.13,172.28.0.14
    networks:
      hyperion-net:
        ipv4_address: 172.28.0.10

  # ============================================================================
  # PHASE 2: Maxxed-Out Bare-Metal io_uring Server
  # ============================================================================
  phase2-iouring:
    build:
      context: .
      dockerfile: docker/phase2/Dockerfile
    container_name: hyperion-phase2-iouring
    profiles: [phase2]
    env_file: [docker/phase2/.env.phase2]
    cpus: "2.0"
    mem_limit: "4g"
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - phase2-db-data:/data
    ports:
      - "8082:80"
    networks:
      hyperion-net:
        ipv4_address: 172.28.0.2

  load-tester-phase2:
    build:
      context: .
      dockerfile: docker/load-tester/Dockerfile
    container_name: hyperion-load-tester-phase2
    profiles: [phase2]
    cap_add:
      - NET_ADMIN
    depends_on:
      - phase2-iouring
    command: >
      /app/load-tester
      --target http://172.28.0.2:80
      --concurrency 65000
      --duration 30
      --ramp-up 15
      --ips 172.28.0.10,172.28.0.11,172.28.0.12,172.28.0.13,172.28.0.14,172.28.0.15
    networks:
      hyperion-net:
        ipv4_address: 172.28.0.10

  # ============================================================================
  # PHASE 3: Kernel Unleashed (Multi-Core SO_REUSEPORT + Kernel Bypass)
  # ============================================================================
  phase3-unleashed:
    build:
      context: .
      dockerfile: docker/phase3/Dockerfile
    container_name: hyperion-phase3-unleashed
    profiles: [phase3]
    env_file: [docker/phase3/.env.phase3]
    cpus: "2.0"
    mem_limit: "4g"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - phase3-db-data:/data
    ports:
      - "8083:80"
    networks:
      hyperion-net:
        ipv4_address: 172.28.0.2

  load-tester-phase3:
    build:
      context: .
      dockerfile: docker/load-tester/Dockerfile
    container_name: hyperion-load-tester-phase3
    profiles: [phase3]
    cap_add:
      - NET_ADMIN
    depends_on:
      - phase3-unleashed
    command: >
      /app/load-tester
      --target http://172.28.0.2:80
      --concurrency 150000
      --duration 45
      --ramp-up 20
      --ips 172.28.0.10,172.28.0.11,172.28.0.12,172.28.0.13,172.28.0.14,172.28.0.15,172.28.0.16,172.28.0.17,172.28.0.18,172.28.0.19
    networks:
      hyperion-net:
        ipv4_address: 172.28.0.10

volumes:
  phase1-db-data:
  phase2-db-data:
  phase3-db-data:

networks:
  hyperion-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
